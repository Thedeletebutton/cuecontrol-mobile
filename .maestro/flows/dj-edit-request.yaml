appId: com.trinitromusic.cuecontrol
---
# DJ Edit and Star Request Flow
# Tests: Add request, star it, edit track/notes

- launchApp

# Dismiss Expo dev menu overlay if present
- swipe:
    start: "50%,60%"
    end: "50%,95%"
    duration: 300
- tapOn:
    point: "50%,10%"
    optional: true

# Navigate to DJ mode
- extendedWaitUntil:
    visible:
      id: "dj-mode-button"
    timeout: 15000

- tapOn:
    id: "dj-mode-button"

# Handle license if needed
- runFlow:
    when:
      visible: "License Key Required"
    file: enter-license.yaml

# Wait for queue
- extendedWaitUntil:
    visible:
      text: "TRACK REQUESTS:"
    timeout: 10000

# Clear any stale data from previous runs
- tapOn:
    id: "queue-clear-button"
    optional: true
- tapOn:
    text: "Clear All"
    optional: true

# Add a request to edit
- tapOn:
    id: "queue-add-button"

- tapOn:
    id: "manual-entry-username"
- inputText: "EditUser"

- tapOn:
    id: "manual-entry-track"
- inputText: "OG Artist - OG Song"

- tapOn:
    id: "manual-entry-submit"

# Wait for request to appear (accessibilityLabel set on content cell)
- extendedWaitUntil:
    visible:
      text: "EditUser, OG Artist - OG Song"
    timeout: 10000

# Tap the edit button (pencil icon) using accessibility label
- tapOn:
    text: "Edit request"

# Wait for edit modal to appear
- extendedWaitUntil:
    visible:
      text: "Edit Request"
    timeout: 5000

# Clear and update track
- tapOn:
    id: "edit-request-track"
- eraseText:
    charactersToErase: 30
- inputText: "New Artist - New Song"

# Add notes
- tapOn:
    id: "edit-request-notes"
- inputText: "120 BPM"

# Dismiss keyboard before submit
- pressKey: Enter

# Submit the edit
- tapOn:
    id: "edit-request-submit"

# Verify the updated track appears
- extendedWaitUntil:
    visible:
      text: "EditUser, New Artist - New Song"
    timeout: 10000

# Clean up - clear all
- tapOn:
    id: "queue-clear-button"
    optional: true
- tapOn:
    text: "Clear All"
    optional: true
