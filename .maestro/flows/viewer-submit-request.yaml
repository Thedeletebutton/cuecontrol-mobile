appId: com.trinitromusic.cuecontrol
---
# Viewer Submit Request Flow
# Tests: Connect to DJ queue, navigate to request form, submit, verify success
# Uses clearState to ensure fresh viewer state (no auto-connect from saved handle)
# Flow: clearState → login → DJ mode → register handle → viewer mode → connect → submit request

- launchApp:
    clearState: true

# Dev build shows Expo launcher - tap localhost to load app
- extendedWaitUntil:
    visible:
      text: "http://localhost:8081"
    timeout: 10000
- tapOn:
    text: "http://localhost:8081"

# Dismiss Expo dev menu overlay if present
- swipe:
    start: "50%,60%"
    end: "50%,95%"
    duration: 300
- tapOn:
    point: "50%,10%"
    optional: true

# Login screen appears after clearState (no auth)
- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 15000

- tapOn:
    id: "login-tab"
- tapOn:
    id: "login-email-input"
- inputText: "e2e-test@cuecontrol-test.com"
- tapOn:
    id: "login-password-input"
- inputText: "TestPassword123!"
- pressKey: Enter
- tapOn:
    id: "login-submit-button"

# After login, mode selection appears
- extendedWaitUntil:
    visible:
      id: "dj-mode-button"
    timeout: 30000

# Enter DJ mode to register a handle
- tapOn:
    id: "dj-mode-button"

# Handle license (clearState cleared saved license)
- runFlow:
    when:
      visible: "License Key Required"
    file: enter-license.yaml

# Wait for queue
- extendedWaitUntil:
    visible:
      text: "TRACK REQUESTS:"
    timeout: 10000

# Register handle "e2etest" in settings
- runFlow:
    file: register-handle.yaml

# Go back to mode selection
- tapOn:
    id: "switch-mode-button"

# Enter Viewer mode
- extendedWaitUntil:
    visible:
      id: "viewer-mode-button"
    timeout: 10000

- tapOn:
    id: "viewer-mode-button"

# Connect to our DJ queue (fresh state, no auto-connect)
- tapOn:
    id: "viewer-dashboard-handle-input"
- inputText: "e2etest"
- pressKey: Enter

# Wait for queue to load and SUBMIT REQUEST button to appear
- extendedWaitUntil:
    visible:
      id: "viewer-submit-request-button"
    timeout: 15000

# Navigate to submit request form
- tapOn:
    id: "viewer-submit-request-button"

# Fill in the request form
- extendedWaitUntil:
    visible:
      id: "viewer-track-input"
    timeout: 10000

- tapOn:
    id: "viewer-username-input"
- inputText: "E2EViewer"

- tapOn:
    id: "viewer-track-input"
- inputText: "E2E Artist - E2E Track"

# Submit (Enter on track input triggers onSubmitEditing which submits the form)
- pressKey: Enter

# Verify success screen
- extendedWaitUntil:
    visible:
      id: "viewer-success-message"
    timeout: 15000

# Test "Submit Another Request" button
- tapOn:
    id: "viewer-new-request-button"

# Should be back on the form
- extendedWaitUntil:
    visible:
      id: "viewer-submit-button"
    timeout: 5000
